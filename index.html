<!doctype html>
<html lang="en">  <head>    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dx8d5hlk1/image/upload/v1757542335/favicon-120x120_jprwqx.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <title>rifftales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function(projectName) {
        if (!projectName || typeof projectName !== 'string') {
          console.error('Anon Hit Counter: Project name is required');
          return;
        }
        
        const API_URL = 'https://anon-hit-counter.vercel.app/log';
        
        function getCurrentDate() {
          return new Date().toISOString().split('T')[0];
        }
        
        function sendHit() {
          fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              project: projectName,
              page: window.location.pathname,
            }),
            keepalive: true
          }).catch(function(error) {
            console.debug('Analytics request failed:', error);
          });
        }
        
        // Always use DOMContentLoaded to ensure single execution
        document.addEventListener('DOMContentLoaded', sendHit);
      })('rifftales');
    </script>
  </body>
</html>

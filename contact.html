<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - rifftales</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Roboto Slab", serif;
      background: linear-gradient(135deg, #1f2937 0%, #374151 50%, #1f2937 100%);
    }
    .form-input {
      background-color: #374151;
      border: 1px solid #4b5563;
      color: #f3f4f6;
    }
    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }
    .form-input::placeholder {
      color: #9ca3af;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white">  <div class="container mx-auto px-4 py-8 max-w-2xl">    <!-- Logo Section - Top Left -->
    <div class="mb-8">
      <a href="/" class="flex items-center space-x-3 text-2xl font-bold mb-6 hover:opacity-80 transition-opacity duration-200 w-fit">
        <img src="/favicon-120x120.png" alt="rifftales Logo" class="h-8 w-8">
        <span class="text-yellow-400" style="filter: drop-shadow(2px 2px 0px rgba(255, 119, 0, 0.5));">rifftales</span>
      </a>
      <div class="text-center">
        <h1 class="text-3xl font-bold text-white mb-2">Contact Us</h1>
        <p class="text-gray-300 text-lg">We'd love to hear from you! Share your thoughts, questions, or feedback.</p>
      </div>
    </div>

    <div class="bg-gray-800/50 rounded-lg p-8 shadow-xl backdrop-blur-sm">
      <form 
        name="contact" 
        method="POST" 
        data-netlify="true" 
        data-netlify-honeypot="bot-field"
        action="/thank-you"
        class="space-y-6"
      >
        <input type="hidden" name="form-name" value="contact" />
        
        <!-- Honeypot field for spam protection -->
        <p class="hidden">
          <label>
            Don't fill this out if you're human: <input name="bot-field" />
          </label>
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="name" class="block text-sm font-semibold text-gray-300 mb-2">
              Name *
            </label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              required
              class="form-input w-full px-4 py-3 rounded-lg transition-colors duration-200"
              placeholder="Your name"
            />
          </div>
          
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-300 mb-2">
              Email *
            </label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              class="form-input w-full px-4 py-3 rounded-lg transition-colors duration-200"
              placeholder="your.email@example.com"
            />
          </div>
        </div>

        <div>
          <label for="subject" class="block text-sm font-semibold text-gray-300 mb-2">
            Subject *
          </label>
          <input 
            type="text" 
            id="subject" 
            name="subject" 
            required
            class="form-input w-full px-4 py-3 rounded-lg transition-colors duration-200"
            placeholder="What's this about?"
          />
        </div>

        <div>
          <label for="message" class="block text-sm font-semibold text-gray-300 mb-2">
            Message *
          </label>
          <textarea 
            id="message" 
            name="message" 
            rows="6"
            required
            class="form-input w-full px-4 py-3 rounded-lg transition-colors duration-200 resize-vertical"
            placeholder="Tell us about your feedback, questions, or anything else on your mind..."
          ></textarea>
        </div>

        <div class="flex justify-center">
          <button 
            type="submit"
            class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50"
          >
            Send Message
          </button>
        </div>
      </form>
    </div>

    <div class="mt-8 p-4 bg-gray-800/50 rounded-lg border border-gray-700">
      <p class="text-center text-gray-300">
        Or contact us directly via email: 
        <a href="#" id="emailLink" class="text-blue-400 hover:text-blue-300 transition-colors duration-200">
          <span id="email99"></span>
        </a>
      </p>
    </div>

    <div class="text-center mt-8">
      <a 
        href="/" 
        class="inline-flex items-center text-blue-400 hover:text-blue-300 transition-colors duration-200"
      >
        ‹ Back to rifftales
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const p1 = "hello";
      const p2 = "melodyapps";
      const p3 = "co.uk";
      const emailAddress = `${p1}@${p2}.${p3}`;
      document.getElementById("email99").innerText = emailAddress;
      document.getElementById("emailLink").href = `mailto:${emailAddress}`;
    });
  </script>
</body>
</html>
